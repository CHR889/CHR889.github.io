name: Build and deploy news

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore translation cache and archive
        uses: actions/cache@v4
        with:
          path: |
            data/translations.zh-CN.json
            data/archive
          key: news-data-${{ github.run_id }}
          restore-keys: |
            news-data-

      - name: Generate site
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 news_site/build_news.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
